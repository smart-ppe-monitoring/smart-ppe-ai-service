[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ppe-ai-service"
version = "2.1.0"
description = "Smart PPE Monitoring — AI Vision & Live Engine Microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9",
    "yt-dlp>=2024.8.6",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "confluent-kafka>=2.4.0",
    "httpx>=0.27.0",
    "minio>=7.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
